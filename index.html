<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Chúc Mừng Năm Mới 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Be+Vietnam+Pro:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <div class="grain" aria-hidden="true"></div>

  <main class="wrap">
    <section class="countdown" aria-live="polite">
      <div class="countdown-top">
        <div class="countdown-kicker">Đếm ngược đến Giao thừa</div>
        <div class="countdown-date" id="countdownDate">17/02/2026 00:00 (GMT+7)</div>
      </div>
      <div class="countdown-mid">
        <div class="countdown-days" id="countdownDays">0 ngày</div>
        <div class="calendar-clock" role="group" aria-label="Đồng hồ đếm ngược">
          <div class="cal-page">
            <div class="cal-num" id="numH">00</div>
            <div class="cal-unit">GIỜ</div>
          </div>
          <div class="cal-page">
            <div class="cal-num" id="numM">00</div>
            <div class="cal-unit">PHÚT</div>
          </div>
          <div class="cal-page">
            <div class="cal-num" id="numS">00</div>
            <div class="cal-unit">GIÂY</div>
          </div>
        </div>
      </div>
    </section>

    <header class="hero" role="banner">
      <div class="badge">2026</div>
      <h1>
        <span class="eyebrow">Chúc Mừng Năm Mới</span>
        <span class="headline">An Khang · Thịnh Vượng</span>
      </h1>
      <p class="sub">
        Chúc bạn và gia đình một năm 2026 thật nhiều sức khỏe, bình an, may mắn và thành công.
      </p>
    </header>

    <footer class="foot">
      <div class="foot-left">Happy New Year 2026</div>
    </footer>
  </main>

  <div id="wishLayer" class="wish-layer" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
